<section class="thank-you-section">
  <div class="container">
    <div class="thank-you-card text-center">
      
      <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>

      <span class="section-badge">SOLICITUD RECIBIDA</span>
      <h1 class="thank-you-title">¡Gracias por contactarnos!</h1>
      <div class="gold-divider"></div>

      <p class="thank-you-desc">
        Hemos recibido su solicitud de consulta financiera. Un consultor sénior de nuestro equipo revisará la información de su empresa.
      </p>

      <!-- Response Commitment Notice -->
      <div class="commitment-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <div>
          <strong class="box-title">Compromiso de Atención Preferencial</strong>
          <p class="box-text">{{ companyData.responseTimeCommitment }}.</p>
        </div>
      </div>

      <div class="thank-you-actions">
        <button (click)="onWhatsappClick()" class="btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span>ABRIR CHAT DE WHATSAPP AHORA</span>
        </button>

        <a routerLink="/" class="btn-secondary">
          <span>VOLVER AL INICIO</span>
        </a>
      </div>

    </div>
  </div>
</section>
