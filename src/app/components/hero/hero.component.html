<section id="hero" class="hero-section">
  <!-- Background Overlay -->
  <div class="hero-bg-overlay"></div>
  <div class="hero-grid-pattern"></div>

    <div class="hero-row">
      <!-- 40% Logo Div -->
      <div class="hero-image-col fade-in">
        <div class="hero-icon-wrapper">
          <img src="assets/images/LogoVerticalBlanco.png" alt="Carvajal Contadores y Consultores" class="hero-icon-img">
        </div>
      </div>

      <!-- 60% Text Content Div -->
      <div class="hero-content-col">
        <!-- Badge -->
        <span class="section-badge fade-in">
          {{ companyData.heroBadge }}
        </span>

        <!-- Main Title -->
        <h1 class="hero-title fade-in">
          {{ companyData.heroTitle }}
        </h1>

        <!-- Description -->
        <p class="hero-description fade-in">
          {{ companyData.heroDescription }}
        </p>

        <!-- Immediate Above-The-Fold CTA Area -->
        <div class="hero-actions fade-in">
          <button (click)="onWhatsappClick()" class="btn-primary hero-main-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <span>ESCRÍBENOS POR WHATSAPP</span>
          </button>
        </div>

        <!-- Compromiso de respuesta badge -->
        <div class="response-commitment-badge fade-in">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>{{ companyData.responseTimeCommitment }}</span>
        </div>
      </div>
    </div>

  <!-- Scroll Down Indicator -->
  <a href="#about" class="scroll-indicator" aria-label="Desplazarse a la sección Quiénes Somos">
    <span class="scroll-text">DESCUBRE MÁS</span>
    <div class="mouse-icon">
      <div class="wheel"></div>
    </div>
  </a>
</section>
