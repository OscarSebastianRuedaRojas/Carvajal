<section id="contact" class="cta-section">
  <!-- Glowing subtle accents -->
  <div class="glow-accent top-left"></div>
  <div class="glow-accent bottom-right"></div>

  <div class="container">
    <div class="cta-card">
      <span class="section-badge">TU TRANQUILIDAD FINANCIERA EMPIEZA HOY.</span>
      
      <h2 class="cta-title">Convierte tus números en decisiones estratégicas.</h2>
      
      <p class="cta-description">
        Permítenos ser tu aliado estratégico y ayudarte a tomar decisiones financieras con mayor claridad y confianza.
      </p>

      <div class="cta-actions">
        <button (click)="onWhatsappClick()" class="btn-primary cta-whatsapp-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <span>ESCRÍBENOS POR WHATSAPP</span>
        </button>
      </div>

      <!-- Response Commitment Badge -->
      <div class="response-commitment">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>{{ companyData.responseTimeCommitment }}</span>
      </div>

    </div>
  </div>
</section>
