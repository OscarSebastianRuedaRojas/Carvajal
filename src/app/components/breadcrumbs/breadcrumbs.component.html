<nav aria-label="Migas de pan" class="breadcrumbs-nav">
  <ol class="breadcrumbs-list">
    <li class="breadcrumb-item">
      <a routerLink="/" class="breadcrumb-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </a>
    </li>

    @for (item of items; track item.label; let last = $last) {
      <li class="breadcrumb-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="separator"><path d="m9 18 6-6-6-6"/></svg>
        @if (item.url && !last) {
          <a [routerLink]="item.url" class="breadcrumb-link">{{ item.label }}</a>
        } @else {
          <span class="breadcrumb-current" aria-current="page">{{ item.label }}</span>
        }
      </li>
    }
  </ol>
</nav>
