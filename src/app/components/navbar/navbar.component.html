<header class="navbar-header" [class.scrolled]="isScrolled">
  <div class="container navbar-container">
    
    <!-- Logo Brand -->
    <a (click)="navigateToSection('hero')" class="brand-logo" aria-label="Carvajal Contadores y Consultores Inicio">
      <img [src]="companyData.logoHorizontal" 
           alt="Logo de Carvajal Contadores y Consultores" 
           class="logo-image" 
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      
      <!-- SVG / Text Fallback Logo -->
      <div class="logo-fallback" style="display: none;">
        <div class="logo-symbol">C</div>
        <div class="logo-text">
          <span class="brand-name">CARVAJAL</span>
          <span class="brand-sub">CONTADORES Y CONSULTORES</span>
        </div>
      </div>
    </a>

    <!-- Desktop Navigation Links: INICIO, NOSOTROS, SERVICIOS, CONTACTO -->
    <nav class="desktop-nav" aria-label="Navegación principal">
      <ul class="nav-list">
        <li><button (click)="navigateToSection('hero')" class="nav-link-btn">INICIO</button></li>
        <li><button (click)="navigateToSection('about')" class="nav-link-btn">NOSOTROS</button></li>
        <li><button (click)="navigateToSection('services')" class="nav-link-btn">SERVICIOS</button></li>
        <li><button (click)="navigateToSection('contact')" class="nav-link-btn">CONTACTO</button></li>
      </ul>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <button (click)="onWhatsappClick()" class="btn-primary nav-cta">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>CONTACTAR POR WHATSAPP</span>
      </button>

      <!-- Mobile Hamburger Button -->
      <button class="hamburger-btn" 
              [class.active]="isMobileMenuOpen" 
              (click)="toggleMobileMenu()" 
              aria-label="Abrir menú de navegación">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Drawer -->
  <div class="mobile-drawer" [class.open]="isMobileMenuOpen">
    <div class="mobile-drawer-content">
      <ul class="mobile-nav-list">
        <li><button (click)="navigateToSection('hero')" class="mobile-link-btn">INICIO</button></li>
        <li><button (click)="navigateToSection('about')" class="mobile-link-btn">NOSOTROS</button></li>
        <li><button (click)="navigateToSection('services')" class="mobile-link-btn">SERVICIOS</button></li>
        <li><button (click)="navigateToSection('contact')" class="mobile-link-btn">CONTACTO</button></li>
      </ul>

      <div class="mobile-cta-wrapper">
        <button (click)="onWhatsappClick(); closeMobileMenu()" class="btn-primary w-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <span>CONTACTAR POR WHATSAPP</span>
        </button>
      </div>
    </div>
  </div>
</header>
