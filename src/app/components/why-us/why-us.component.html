<section id="why-us" class="why-us-section">
  <div class="container">
    
    <!-- Header -->
    <div class="section-header text-center">
      <span class="section-badge">¿POR QUÉ ELEGIRNOS?</span>
      <h2 class="section-title">Una visión financiera enfocada en tus resultados.</h2>
      <div class="gold-divider"></div>
    </div>

    <!-- Value Propositions Grid -->
    <div class="values-grid">
      @for (item of values; track item.title) {
        <div class="value-card">
          
          <div class="value-icon">
            @switch (item.icon) {
              @case ('trending-up') {
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
              }
              @case ('users') {
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              }
              @case ('shield-check') {
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
              }
              @case ('award') {
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
              }
            }
          </div>

          <h3 class="value-title">{{ item.title }}</h3>

          <p class="value-description">{{ item.description }}</p>

          <div class="gold-accent-line"></div>
        </div>
      }
    </div>

  </div>
</section>
